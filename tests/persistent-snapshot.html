<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#eee} #dashboard{width:400px;max-width:calc(100% - 24px);margin:auto}ha-card{display:block;background:white}</style>
<div id="dashboard"></div>
<script>
  customElements.define('ha-card', class extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: 'open' }); }
    connectedCallback() {
      const header = this.getAttribute('header');
      this.shadowRoot.innerHTML = `${header ? `<div style="padding:16px;height:24px">${header}</div>` : ''}<slot></slot>`;
    }
  });
</script>
<script src="../dist/weather-chart-card-ha.js"></script>
<script>
  const unavailable = sessionStorage.getItem('test-outage') === 'yes';
  const card = document.createElement('weather-chart-card');
  const hass = {
    language: 'en', config: { location_name: 'Test Home', latitude: 24, longitude: 121, unit_system: { temperature: '°C', length: 'km', wind_speed: 'km/h', pressure: 'hPa' } },
    states: {
      'sun.sun': { state: 'above_horizon', attributes: {} },
      'weather.home': unavailable ? { state: 'unavailable', attributes: {} } : { state: 'sunny', last_changed: '2026-10-11T09:00:00Z', attributes: { temperature: 22, temperature_unit: '°C', humidity: 65, wind_speed: 15, wind_speed_unit: 'km/h', supported_features: 3 } },
      'sensor.text': unavailable ? { state: 'unavailable', attributes: {} } : { state: 'Tomorrow is sunny', attributes: { friendly_name: 'Forecast' }, last_changed: '2026-10-11T09:01:00Z' }
    },
    connection: { subscribeMessage(callback) {
      window.latestForecastCallback = callback;
      if (!unavailable) setTimeout(() => callback({ forecast: [{ datetime: '2026-10-12T12:00:00Z', temperature: 24, templow: 17, condition: 'sunny', precipitation: 0 }] }), 0);
      return Promise.resolve(() => {});
    } }
  };
  card.setConfig({ entity: 'weather.home', title: 'Weather', icons: 'http://snapshot.test/dist/icons/', animated_icons: true, show_sun: false, show_time: false, show_text_sensor: true, text_sensor_entity: 'sensor.text', show_last_changed: true, forecast: { condition_icons: true, disable_animation: true } });
  card.hass = hass;
  document.querySelector('#dashboard').append(card);
  window.fixture = { card, hass };
</script>
